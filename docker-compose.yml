version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  user-service:
    build: ./UserService
    container_name: user-service
    ports:
      - "8001:8000"
    depends_on:
      - rabbitmq

  product-service:
    build: ./ProductService
    container_name: product-service
    ports:
      - "8002:8000"
    depends_on:
      - rabbitmq

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8003:8000"
    depends_on:
      - rabbitmq

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8004:8000"
    depends_on:
      - rabbitmq