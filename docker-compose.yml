services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - utsiae-network

  user-db:
    image: mysql:8
    container_name: user-db
    environment:
      MYSQL_DATABASE: user_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    networks:
      - utsiae-network

  product-db:
    image: mysql:8
    container_name: product-db
    environment:
      MYSQL_DATABASE: laundry_product_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    networks:
      - utsiae-network

  order-db:
    image: mysql:8
    container_name: order-db
    environment:
      MYSQL_DATABASE: laundry_order_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    networks:
      - utsiae-network

  payment-db:
    image: mysql:8
    container_name: payment-db
    environment:
      MYSQL_DATABASE: laundry_payment_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3310:3306"
    networks:
      - utsiae-network

  # New Database Services for the 3 Flask Services
  notification-db:
    image: mysql:8
    container_name: notification-db
    environment:
      MYSQL_DATABASE: laundry_notification_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3311:3306"
    networks:
      - utsiae-network

  review-db:
    image: mysql:8
    container_name: review-db
    environment:
      MYSQL_DATABASE: laundry_review_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3312:3306"
    networks:
      - utsiae-network

  inventory-db:
    image: mysql:8
    container_name: inventory-db
    environment:
      MYSQL_DATABASE: laundry_inventory_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3313:3306"
    networks:
      - utsiae-network

  user-service:
    build: ./UserService
    ports:
      - "8001:8000"
    depends_on:
      - user-db
    networks:
      - utsiae-network

  product-service:
    build: ./ProductService
    ports:
      - "8002:8000"
    depends_on:
      - product-db
      - rabbitmq
    networks:
      - utsiae-network

  product-worker:
    build: ./ProductService
    command: php artisan queue:work rabbitmq --sleep=3 --tries=3
    depends_on:
      - product-db
      - rabbitmq
    networks:
      - utsiae-network

  order-service:
    build: ./order-service
    ports:
      - "8003:8000"
    depends_on:
      - order-db
      - rabbitmq
    networks:
      - utsiae-network

  payment-service:
    build: ./payment-service
    container_name: utsiae-payment-service-1
    ports:
      - "8004:8000"
    depends_on:
      - payment-db
      - rabbitmq
    networks:
      - utsiae-network

  payment-worker:
    build: ./payment-service
    container_name: utsiae-payment-worker-1
    command: php artisan queue:work rabbitmq --queue=payment.process --sleep=3 --tries=3
    depends_on:
      - payment-db
      - rabbitmq
    networks:
      - utsiae-network

  # New Flask Services
  notification-service:
    build: ./notification-service
    ports:
      - "8005:5000"
    depends_on:
      - notification-db
    networks:
      - utsiae-network

  review-service:
    build: ./review-service
    ports:
      - "8006:5000"
    depends_on:
      - review-db
      - user-service
      - product-service
    networks:
      - utsiae-network

  inventory-service:
    build: ./inventory-service
    ports:
      - "8007:5000"
    depends_on:
      - inventory-db
    networks:
      - utsiae-network

networks:
  utsiae-network:
    driver: bridge